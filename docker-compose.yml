services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    image: quizapp/app:latest
    container_name: quizapp-app
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: serverName=quizapp
    networks: [quizapp]

  web:
    image: nginx:1.27-alpine
    container_name: quizapp-web
    restart: unless-stopped
    ports:
      - "8097:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [quizapp]

  worker:
    image: quizapp/app:latest
    container_name: quizapp-worker
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    # Single queue worker — run as the quizapp user; auto-restart on crash via Docker.
    command: >
      sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'waiting for artisan…'; sleep 2; done;
             exec php artisan queue:work redis --queue=high,default,webhooks --tries=1 --sleep=1 --timeout=120"
    networks: [quizapp]

  scheduler:
    image: quizapp/app:latest
    container_name: quizapp-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    user: "${WWWUSER:-1000}:${WWWGROUP:-1000}"
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app
    # Loops every minute, equivalent to `* * * * * php artisan schedule:run`
    command: >
      sh -c "while [ ! -f /var/www/html/artisan ]; do echo 'waiting for artisan…'; sleep 2; done;
             while true; do php artisan schedule:run --no-interaction >> /dev/stdout 2>&1; sleep 60; done"
    networks: [quizapp]

networks:
  quizapp:
    driver: bridge
