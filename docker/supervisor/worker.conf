[supervisord]
nodaemon=true
user=root

[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=high,default,webhooks --tries=1 --sleep=1 --timeout=120
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
stopwaitsecs=120
